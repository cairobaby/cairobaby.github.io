<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>cairobaby · 个人主页</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f172a;
      color: #e2e8f0;
      overflow: hidden;
      position: relative;
    }
    /* 背景光晕 */
    .glow {
      position: absolute;
      width: 500px; height: 500px;
      border-radius: 50%;
      filter: blur(120px);
      opacity: 0.35;
      z-index: 0;
    }
    .glow-1 { background: #0891b2; top: -150px; left: -100px; }
    .glow-2 { background: #16a34a; bottom: -150px; right: -100px; }

    .card {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 48px 40px;
      max-width: 560px;
      width: 90%;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 20px;
      backdrop-filter: blur(10px);
      box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    }
    .avatar {
      width: 96px; height: 96px;
      margin: 0 auto 20px;
      border-radius: 50%;
      background: linear-gradient(135deg, #06b6d4, #22c55e);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      font-weight: 700;
      color: #0f172a;
      border: 3px solid rgba(255,255,255,0.2);
    }
    h1 { font-size: 30px; margin-bottom: 6px; letter-spacing: 0.5px; }
    .subtitle {
      color: #67e8f9;
      font-size: 15px;
      margin-bottom: 18px;
    }
    .bio {
      color: #94a3b8;
      font-size: 15px;
      line-height: 1.8;
      margin-bottom: 26px;
    }
    .links { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }
    .btn {
      display: inline-block;
      padding: 11px 24px;
      border-radius: 10px;
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      transition: transform 0.2s, box-shadow 0.2s;
      border: 1px solid transparent;
    }
    .btn-primary {
      background: linear-gradient(135deg, #06b6d4, #22c55e);
      color: #0f172a;
    }
    .btn-ghost {
      background: transparent;
      color: #e2e8f0;
      border-color: rgba(255,255,255,0.25);
    }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(0,0,0,0.35); }
    footer {
      margin-top: 28px;
      font-size: 12px;
      color: #64748b;
    }
    @media (max-width: 480px) {
      .card { padding: 36px 22px; }
      h1 { font-size: 24px; }
    }
  </style>
</head>
<body>
  <div class="glow glow-1"></div>
  <div class="glow glow-2"></div>

  <div class="card">
    <div class="avatar">C</div>
    <h1>Hi, I'm cairobaby</h1>
    <div class="subtitle">GitHub 新手 · 正在学习编程</div>
    <p class="bio">
      这是我的第一个个人主页。<br>
      我正在学习 Git、GitHub 和网页开发，希望在这里记录成长，
      以后放上更多有趣的项目。
    </p>
    <div class="links">
      <a class="btn btn-primary" href="https://github.com/cairobaby" target="_blank" rel="noopener">我的 GitHub</a>
      <a class="btn btn-ghost" href="mailto:493583055@qq.com">联系我</a>
    </div>
    <footer>© 2026 cairobaby · Powered by GitHub Pages</footer>
  </div>
</body>
</html>
